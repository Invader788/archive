
# --- Pywal Colors ---
# Generated by pywal
[general]
import = [
    "~/.cache/wal/colors-alacritty.toml"
]

# --- Window ---
[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.45
decorations = "None"

# --- Font ---
[font]
size = 12

[font.normal]
family = "MartianMono Nerd Font"
style = "Regular"

[font.bold]
family = "MartianMono Nerd Font"
style = "Bold"

[font.italic]
family = "MartianMono Nerd Font"
style = "Italic"

# --- Cursor ---
[cursor]
style = { shape = "Beam", blinking = "On" }

# --- Shell ---
[terminal.shell]
program = "/usr/bin/zsh"

# --- Keybindings ---
[[keyboard.bindings]]
key = "Z"
mods = "Control|Shift"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "X"
mods = "Control|Shift"
action = "IncreaseFontSize"
# --- Window ---
[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.45
decorations = "None"

# --- Font ---
[font]
size = 9

[font.normal]
family = "MartianMono Nerd Font"
style = "Regular"

[font.bold]
family = "MartianMono Nerd Font"
style = "Bold"

[font.italic]
family = "MartianMono Nerd Font"
style = "Italic"

# --- Colors ---
[colors.primary]
background = "#000000"
foreground = "#ebebeb"

[colors.cursor]
text = "#303030"
cursor = "#ebebeb"

[colors.selection]
text = "#FFFFFF"
background = "#505050"

[colors.normal]
black   = "#000000"
red     = "#575757"
green   = "#686868"
yellow  = "#797979"
blue    = "#8F8F8F"
magenta = "#AFAFAF"
cyan    = "#D1D1D1"
white   = "#ebebeb"

[colors.bright]
black   = "#a4a4a4"
red     = "#575757"
green   = "#686868"
yellow  = "#797979"
blue    = "#8F8F8F"
magenta = "#AFAFAF"
cyan    = "#D1D1D1"
white   = "#ebebeb"

# --- Cursor ---
[cursor]
style = { shape = "Beam", blinking = "On" }

# --- Shell ---
[terminal.shell]
program = "/usr/bin/zsh"

# --- Keybindings ---
[[keyboard.bindings]]
key = "Z"
mods = "Control|Shift"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "X"
mods = "Control|Shift"
action = "IncreaseFontSize"
